pages:
  - page: "Library Generation" #default one
    title: "It will be shown when the knowledge base page is clicked"
    slug: "default"
    entitypageslug: "barcodedcellsample"
    description: "The Library Generation Model is a data model designed to represent types and relationships of samples and digital data assets generated during processes that generate multimodal genomic data. The Library Generation Model can be used to formalize relationships between samples generated during processes in the Anatomical Level and Cellular Level conduced by the Specimen Portal and Sequence Library (SeqLib) Portal. The Specimen Portal focuses on tissue management from donors to brain slabs and annotated brain samples. The SeqLib Portal manages the workflow starting from tissue, all the way downstream to track data deposition to assay-dependent, data-modality-specific archives."
    sparql_query: |-
      PREFIX bican: <https://identifiers.org/brain-bican/vocab/>
      PREFIX NIMP: <http://example.org/NIMP/>
      PREFIX biolink: <https://w3id.org/biolink/vocab/>
      PREFIX prov: <http://www.w3.org/ns/prov#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?id ?label ?category
      WHERE {
      GRAPH <https://www.portal.brain-bican.org/grapidreleasev01> {

      VALUES ?category {
        "bican:BarcodedCellSample"^^xsd:anyURI
        "bican:Library"^^xsd:anyURI
      }

      ?id biolink:category ?category ;
        rdfs:label ?label .
      }
      }
    # TODO: this is not used
    display_column_first: "id"
    display_column_second: "label"
    display_column_third: "category"
    column_filter_index: 2
  - page: "Barcoded Cell Sample"
    title: "Barcoded Cell Sample"
    slug: "barcodedcellsample"
    description: "A collection of molecularly barcoded cells. Input will be either dissociated cell sample or enriched cell sample. Cell barcodes are only guaranteed to be unique within this one collection. One dissociated cell sample or enriched cell sample can lead to multiple barcoded cell samples.  The sequences of the molecular barcodes are revealed during alignment of the resulting fastq files for the barcoded cell sample. The barcoded cell sample name and the cell level molecular barcode together uniquely identify a single cell. "
    sparql_query: |-
      PREFIX bican: <https://identifiers.org/brain-bican/vocab/>
      PREFIX NIMP: <http://example.org/NIMP/>
      PREFIX biolink: <https://w3id.org/biolink/vocab/>
      PREFIX prov: <http://www.w3.org/ns/prov#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?id ?label
      WHERE {
      GRAPH <https://www.portal.brain-bican.org/grapidreleasev01> {
          ?id biolink:category "bican:BarcodedCellSample"^^<http://www.w3.org/2001/XMLSchema#anyURI>;
              rdfs:label ?label;
        }
      }
    # TODO: this is not used
    # display_column_first: "id"
    # display_column_second: "label"

  - page: "Library Aliquot"
    title: "Library Aliquot"
    description: "One library in the library pool. Each library aliquot in a library pool will have a unique R1/R2 index to allow for sequencing together then separating the sequencing output by originating library aliquot through the process of demultiplexing. The resulting demultiplexed fastq files will include the library aliquot name.  A given library may produce multiple library aliquots, which is done in the case of resequencing.  Each library aliquot will produce a set of fastq files."
    slug: "LibraryAliquot"
    sparql_query: |-
      PREFIX bican: <https://identifiers.org/brain-bican/vocab/>
      PREFIX NIMP: <http://example.org/NIMP/>
      PREFIX biolink: <https://w3id.org/biolink/vocab/>
      PREFIX prov: <http://www.w3.org/ns/prov#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?id ?label
      WHERE {
      GRAPH <https://www.portal.brain-bican.org/grapidreleasev01> {
          ?id biolink:category "bican:Library"^^<http://www.w3.org/2001/XMLSchema#anyURI>;
              rdfs:label ?label;
        }
      }
    default_kb: false
    # TODO: this is not used
    #display_column_first: "id"
    #display_column_second: "label"
    #display_column_third: "category"

